verifications:
- name: FrameworkDotnetBuild
  prompt: >
    Run `dotnet build --warnaserror` in the plan's worktree directory (not the original repo) and verify it succeeds with zero errors and zero warnings. Then also build the sample and documentation projects to catch breaking changes: 1. `dotnet build --warnaserror` in `src\Ivy.Samples` 2. `dotnet build --warnaserror` in `src\Ivy.Docs` All three builds must pass.
- name: DotnetBuild
  prompt: Run `dotnet build --warnaserror` in the plan's worktree directory (not the original repo) and verify it succeeds with zero errors and zero warnings.
- name: DotnetTest
  prompt: >
    Run dotnet tests in the plan's worktree directory (not the original repo). 1. Read the plan revision's **## Tests** section for test scope instructions. 2. If the plan specifies a `dotnet test --filter` expression, run:
       `dotnet test --filter "<filter from plan>"`
       Common filter examples:
       - By class: `dotnet test --filter "FullyQualifiedName~MyTestClass"`
       - By namespace: `dotnet test --filter "Namespace~MyNamespace"`
       - Multiple: `dotnet test --filter "FullyQualifiedName~TestA|FullyQualifiedName~TestB"`
    3. If the plan says "No existing test coverage" or "No dotnet tests needed", skip with Pass. 4. If the plan says "Run all tests (broad cross-cutting change)", run `dotnet test` (all tests). 5. If the plan does NOT specify any test scope at all, FAIL the verification with message:
       "No test filter specified in plan. Plans must specify a dotnet test --filter expression in the ## Tests section."
    6. Verify all executed tests pass.
- name: DotnetFormat
  prompt: Run `dotnet format` in the plan's worktree directory (not the original repo), scoped to only the files changed by this plan's commits. Get the list of changed .cs files with `git diff --name-only --diff-filter=ACM HEAD~<N> -- '*.cs'` (where N is the number of commits in this execution), then run `dotnet format --include <files>`. If it modifies any files, stage and commit them. If no .cs files were changed, skip this verification.
- name: FrameworkFrontendLint
  prompt: Run `cd src\frontend && npm run lint && npm run format:check` and verify no errors.
- name: IvyFrameworkVerification
  prompt: >
    Visually verify UI changes by delegating to the IvyFrameworkVerification promptware. You MUST run this as an external process — do NOT attempt to do the verification yourself or write the report directly.

    COPY THE COMMAND BELOW EXACTLY — only replace angle-bracketed placeholders with actual paths. The plan folder is a POSITIONAL argument (NOT `--plan-folder`). The `--value` flags are REQUIRED.

    Execute: `tendril promptware run IvyFrameworkVerification "<TendrilPlanFolder>" --value VerificationDir="<TendrilPlanFolder>\verification" --value ArtifactsDir="<TendrilPlanFolder>\artifacts" --value IvyFrameworkPath="<worktree path to Ivy-Framework>"`

    Example with real paths: `tendril promptware run IvyFrameworkVerification "D:\Plans\03683-Example" --value VerificationDir="D:\Plans\03683-Example\verification" --value ArtifactsDir="D:\Plans\03683-Example\artifacts" --value IvyFrameworkPath="D:\Plans\03683-Example\worktrees\Ivy-Framework"`

    Wait for the process to complete (it may take several minutes). After the process exits, IMMEDIATELY check if `<TendrilPlanFolder>\verification\IvyFrameworkVerification.md` exists. If the file exists, read it and set status based on the Result field in its YAML frontmatter. If exit code is non-zero OR the report file does not exist, set status to Fail immediately — do not poll or wait. Do NOT write the verification report yourself — the promptware creates it.
- name: CheckResult
  prompt: >
    Verify the implementation matches what was requested in the plan. 1. Read the plan revision from `<TendrilPlanFolder>\revisions\` (latest numbered .md file) 2. Read all commits made by this execution from `plan.yaml` `commits` list 3. For each commit, review the diff (`git show <hash>`) in the worktree 4. Compare the plan's **Problem** and **Solution** sections against the actual changes:
       - Are all described changes present?
       - Are there unexpected\unrelated changes?
       - Do the changes solve the stated problem?
    5. If the plan has a **Tests** section, verify those tests were actually written 6. Write the verification report to `<TendrilPlanFolder>\verification\CheckResult.md` Report format: ```

    ---

    result: Pass

    date: <CurrentTime>

    attempts: 1

    ---

    # CheckResult

    ## Requested vs Delivered | Requirement | Status | Notes | |-------------|--------|-------| | <from plan> | Done \ Missing \ Partial | <details> |

    ## Unexpected Changes

    <list any changes not described in the plan, or "None">

    ## Output

    <summary assessment>

    ## Fixes Applied

    None

    ## Issues Found

    <any gaps between plan and implementation, or "None"> ```
- name: CodeReview
  prompt: >-
    Perform a code review of all changes made by this plan's commits, using Claude Code's built-in `\code-review` skill. Always fix major findings; log minor concerns as plan recommendations.


    **Step 1: Locate the changes**

    - The plan folder is `<TendrilPlanFolder>`. The plan id is the folder's name (e.g. `03683-Example`).

    - Find the worktree(s) under `<TendrilPlanFolder>\Worktrees\`. The code produced by this plan lives on the plan's branch there. If there are no worktrees, use the current working directory.

    - `cd` into the worktree so the review sees this plan's diff (the plan branch against its base branch).


    **Step 2: Run the \code-review skill**

    - Invoke the `\code-review` skill via the Skill tool at `high` effort: `\code-review high`.

    - Do NOT pass `--fix` (that would apply every finding indiscriminately — we want per-severity handling below) and do NOT pass `--comment`.

    - Let the skill produce its findings (it reports them via ReportFindings, most-severe first). Collect them.


    **Step 3: Classify findings by severity**

    - **Major** = anything that is or could be wrong: correctness bugs, security issues, crashes, data loss, broken behavior, resource leaks, incorrect logic, missing error handling at a real boundary. When a finding's severity is ambiguous, treat it as major.

    - **Minor** = optional cleanups that don't change behavior: naming, style, simplification, minor duplication, readability, micro-efficiency, nitpicks.


    **Step 4: Always fix major findings**

    - Fix every major finding directly in the worktree.

    - Stage and commit the fixes (`git add` + `git commit`) with a clear message, e.g. `code-review: fix <short description>`. One commit per logical fix, or a single grouped commit — your judgement.

    - Re-run a quick sanity check (build\relevant tests) if a fix is non-trivial and the tooling is readily available.


    **Step 5: Log minor concerns as recommendations — do NOT fix them**

    - For each minor concern, add a plan recommendation:
      `tendril plan rec add "<plan-id>" "<short imperative title>"`
    - Then attach detail as markdown via:
      `tendril plan rec set "<plan-id>" "<short imperative title>" description "<detail>"`
      Write `<detail>` as a markdown link to the file (`[file.cs:42](file:///absolute/path/to/file.cs)`,
      line number in the link text only, never in the URL) followed by what to change.
    - Use the plan id derived in Step 1 (the plan folder name works as the id).

    - Do not edit code for minor concerns — they are left for the human to accept or decline.


    **Step 6: Write the report**

    Write the verification report to `<TendrilPlanFolder>\Verification\CodeReview.md` in this format:

    ```

    ---

    result: Pass

    date: <timestamp>

    attempts: 1

    ---

    # CodeReview


    ## Review Method


    Ran Claude Code `\code-review high` in <worktree path>.


    ## Major Findings (fixed)


    | File:Line | Finding | Fix commit |

    |-----------|---------|------------|

    | <path:line> | <description> | <sha or "—"> |


    (or "None")


    ## Minor Concerns (logged as recommendations)


    | File:Line | Concern | Recommendation title |

    |-----------|---------|----------------------|

    | <path:line> | <description> | <rec title> |


    (or "None")


    ## Summary


    <overall assessment: what was reviewed, what was fixed, what was deferred to recommendations>

    ```


    **Step 7: Determine Result**

    - **Pass** — the review completed and all major findings were fixed and committed (minor concerns logged as recommendations do not fail the verification).

    - **Fail** — a major finding could not be fixed automatically (e.g. it needs a human design decision), or the `\code-review` skill could not run. Describe the blocker in the Summary.
- name: NewWidgetChecklist
  prompt: >
    Verify all 6 required elements exist for any new widget created by this plan: 1. Backend widget class — src\Ivy\Widgets\<WidgetName>.cs with [Prop]\[Event] attributes, [JsonIgnore] on delegates, Has* booleans 2. Frontend React component — src\frontend\src\widgets\<widgetName>\<WidgetName>Widget.tsx 3. Index export — src\frontend\src\widgets\<widgetName>\index.ts 4. Widget map registration — import + entry in src\frontend\src\widgets\widgetMap.ts 5. Sample app — src\Ivy.Samples.Shared\Apps\Widgets\<WidgetName>App.cs 6. Documentation page — src\Ivy.Docs.Shared\Docs\02_Widgets\<category>\<WidgetName>.md Check each file exists and follows conventions. Report which elements are present vs missing.
- name: RustBuild
  prompt: >
    Run `cargo build --release` in the Rust source directory (src\Rustino.Native). Verify the build completes with zero errors and zero warnings. The output cdylib should be in target\release\ (rustino_native.dll on Windows, librustino_native.so on Linux, librustino_native.dylib on macOS).
- name: RustTest
  prompt: >
    Run `cargo test` in the Rust source directory (src\Rustino.Native). Verify all tests pass. If no test files exist, report "No tests found" and pass.
- name: RustClippy
  prompt: >
    Run `cargo clippy -- -D warnings` in the Rust source directory (src\Rustino.Native). Verify no warnings or errors are reported. Clippy is the Rust linter.
- name: VitePlusCheck
  prompt: >
    Run `vp check` in the VitePlus frontend directory of the project repo. For PrCostCalculator: run in repo root. For Framework: `cd src\frontend && vp check` For Console: `cd Ivy.Studio\Widgets\frontend && vp check` If `vp check` reports fixable issues, run `vp check --fix`, then stage and commit the changes. Also run `vp build` to verify the production build succeeds.
- name: NpmTest
  prompt: Run `pnpm test:unit` (or `npm test`) in the plan's worktree directory. Filter to tests relevant to the plan's changes if a Tests section exists. Report pass\fail counts.
- name: NpmLint
  prompt: Run `pnpm lint` (or the project's lint script) in the plan's worktree directory. Report any lint errors or warnings. If there are auto-fixable issues, run `pnpm check` or `pnpm lint --fix` and commit the fixes.
- name: NpmBuild
  prompt: Run `pnpm build` (or the project's build\typecheck script) in the plan's worktree directory. Verify the build completes with zero errors. Report any type errors or build failures.
- name: WidgetsFrontendCheck
  prompt: >
    Run the Vite+ checks for the Ivy.Tendril.Widgets frontend in the plan's worktree directory (not the original repo).


    Working directory: `src\Ivy.Tendril.Widgets\frontend` inside the Ivy-Tendril worktree.


    1. If `node_modules` is missing, install dependencies first. IMPORTANT: the vite-plus native binding requires Node `^20.19.0 || ^22.18.0 || >=24.11.0`. If the system Node is older (e.g. 22.17.1), pnpm silently skips the native package and every later build fails with "Cannot find native binding" / "Cannot find module '@voidzero-dev/vite-plus-win32-x64-msvc'". Install with the Node that vite-plus bundles on PATH:
       `$env:PATH = "$env:USERPROFILE\.vite-plus\bin;$env:PATH"; npx -y pnpm@10.33.0 install --config.confirmModulesPurge=false`
    2. **Scope to this plan's changes.** The frontend has pre-existing formatting drift, so never check or fix the whole tree. Get the frontend files this plan touched with
       `git diff --name-only --diff-filter=ACM HEAD~<N> -- src/Ivy.Tendril.Widgets/frontend`
       (N = number of commits in this execution), then convert them to paths relative to `frontend\` and pass them through: `npx vp check <file> <file> ...`.
    3. If it reports fixable issues **in those files**, run `npx vp check --fix <same files>`, then stage and commit the changes. Never run a bare `npx vp check --fix` — it would reformat ~32 unrelated files and pollute the PR.

    4. Re-run `npx vp check <files>` and verify it is clean. Fail only on lint or type errors, or formatting issues, in files this plan changed.

    5. If this plan changed no files under `src\Ivy.Tendril.Widgets\frontend`, skip this verification with Pass.
- name: WidgetsDotnetBuild
  prompt: >
    Build the Ivy.Tendril.Widgets library and its samples app in the plan's worktree directory (not the original repo). This project is scoped to `src\Ivy.Tendril.Widgets` — do NOT build the whole Ivy-Tendril solution.


    1. `dotnet build --warnaserror src\Ivy.Tendril.Widgets\Ivy.Tendril.Widgets.csproj`

    2. `dotnet build --warnaserror src\Ivy.Tendril.Widgets\.samples\Ivy.Tendril.Widgets.Samples.csproj`


    Both must succeed with zero errors and zero warnings.


    Notes:

    - The library csproj builds the React bundle via its `WidgetsNpmInstall` / `WidgetsBuildFrontend` MSBuild targets (`npx -y pnpm@10.33.0 install` and `run build` in `frontend`), so the frontend bundle build is covered here.

    - `.samples` sets `IvySource=true`, which makes Ivy.Tendril.Widgets reference `..\..\..\Ivy-Framework\src\Ivy\Ivy.csproj` — the Ivy-Framework worktree must be present as a sibling of the Ivy-Tendril worktree. If it is missing, report the failure; never edit the csproj to work around it.

    - If the build fails with "Cannot find native binding" / "Cannot find module '@voidzero-dev/vite-plus-win32-x64-msvc'", the frontend deps were installed with a Node below vite-plus's `^22.18.0` floor. Reinstall with vite-plus's bundled Node on PATH, then rebuild:
      `cd src\Ivy.Tendril.Widgets\frontend; $env:PATH = "$env:USERPROFILE\.vite-plus\bin;$env:PATH"; npx -y pnpm@10.33.0 install --config.confirmModulesPurge=false`
- name: WidgetsFrontendTest
  prompt: >
    Run the frontend unit tests (vitest via Vite+) for Ivy.Tendril.Widgets in the plan's worktree directory (not the original repo).


    Working directory: `src\Ivy.Tendril.Widgets\frontend` inside the Ivy-Tendril worktree.


    1. Read the plan revision's **## Tests** section for test scope instructions.

    2. Run the tests once (non-watch), scoped to the plan:
       - Scoped (preferred): `npx vp test --run <path-or-pattern>` for the widget(s) this plan touched, e.g. `npx vp test --run src/PlanDiffView`.
       - Full suite: `npx vp test --run` only when the plan says the change is cross-cutting.
       - If the `vp test` passthrough misbehaves, fall back to `npx vitest run [pattern]` (vitest and `vitest.config.ts` are present; `package.json` has no `test` script).
    3. Verify all executed tests pass and report pass/fail counts.

    4. **Pre-existing failures.** This suite is not fully green on the base branch (as of 2026-08-13, 4 tests in `src/PlanDiffView/PlanDiffView.test.tsx` fail there). If a test fails, check whether it also fails on the base branch — e.g. run the same spec at `git stash` / a clean base checkout, or inspect whether the plan touched that file at all. Report such failures as PRE-EXISTING in the summary and do not fail this verification for them. Any test that passes on the base branch and fails after this plan's changes IS a real failure — fail the verification.

    5. If the plan changed no files under `src\Ivy.Tendril.Widgets\frontend`, skip this verification with Pass.


    Dependencies: if `node_modules` is missing, install it the way the `WidgetsFrontendCheck` verification describes — with vite-plus's bundled Node on PATH (`$env:PATH = "$env:USERPROFILE\.vite-plus\bin;$env:PATH"`), otherwise the native binding is skipped.
- name: WidgetsE2ETest
  prompt: >
    Run the Playwright E2E suite for Ivy.Tendril.Widgets in the plan's worktree directory (not the original repo).


    Working directory: `src\Ivy.Tendril.Widgets\.tests` inside the Ivy-Tendril worktree.


    1. Read the plan revision's **## Tests** section. If the plan changed no widget behavior or UI (for example C#-comment-, docs- or config-only changes), skip this verification with Pass.

    2. On a fresh worktree, install first: `npm install`, then `npx playwright install chromium`.

    3. Run the specs relevant to the changed widget: `npx playwright test widgets/<widget-name>`. Run the full suite (`npx playwright test`) only when the plan states the change is cross-cutting.

    4. `global-setup.ts` builds the `.samples` project, picks a free port, spawns `dotnet run` and waits for an HTTPS health check; `global-teardown.ts` kills the server process tree. The suite is single-worker and sequential, so allow several minutes.

    5. Verify all executed specs pass. On failure, inspect `.tests\artifacts\` (step screenshots, per-test console logs, `backend.log`) and report the actual cause rather than just the assertion text.

    6. The `.samples` build in global setup needs the Ivy-Framework worktree present as a sibling of the Ivy-Tendril worktree (`.samples` sets `IvySource=true`). If setup fails for that reason, report it instead of editing project files.
- name: NewTendrilWidgetChecklist
  prompt: >
    Verify the required elements exist for any NEW widget this plan adds to Ivy.Tendril.Widgets. If the plan adds no new widget, skip this verification with Pass.


    Paths are relative to `src\Ivy.Tendril.Widgets` in the Ivy-Tendril worktree:


    1. Backend widget record — `<WidgetName>.cs` with `[Prop]` / `[Event]` attributes, `[JsonIgnore]` on delegates, `Has*` booleans, and the external-widget attribute whose `GlobalName` is `IvyTendrilWidgets`.

    2. Frontend component — `frontend\src\<WidgetName>.tsx` or `frontend\src\<WidgetName>\<WidgetName>.tsx`.

    3. Registration — imported and present in BOTH the `window.IvyTendrilWidgets` object and the export list in `frontend\src\index.ts`.

    4. Sample app — `.samples\Apps\<WidgetName>\<Something>App.cs` (the namespace path maps to the kebab-case URL, e.g. `WidgetSamples.Apps.DraftMarkdown.AnnotationsApp` -> `/draft-markdown/annotations`).

    5. Playwright spec — `.tests\widgets\<widget-name>\*.spec.ts`.

    6. Contract conformance — camelCase props on the JS side matching the PascalCase C# `[Prop]` names; events fired via `eventHandler(eventName, widgetId, [args])`; named slots read from `slots.SlotName` (PascalCase preserved from `[Slot("Name")]`).


    Report which elements are present versus missing. `src\Ivy.Tendril.Widgets\AGENTS.md` documents the full widget/framework contract.
